# 동그리 올인원 스택: 백엔드 + DB + 모니터링을 한 번에 띄운다.
#
#   로컬:     docker compose up -d --build
#   AWS EC2:  서버 한 대에 도커 설치 후 같은 파일 그대로 (git pull → up)
#
# 이 파일은 monitoring/docker-compose.yml 을 include 해서 모니터링 컨테이너
# (prometheus·loki·alloy·node-exporter·cadvisor·postgres-exporter·grafana)를 가져오고,
# 여기에 db 와 backend 를 얹는다. 모두 같은 도커 네트워크(donggree-monitoring)에 붙어
# 서비스 이름으로 서로를 찾는다 (backend → db, prometheus → backend, postgres-exporter → db).
#
# 모니터링만 따로 쓰고 싶으면(예: 백엔드는 bootRun) monitoring/ 의 compose 를 단독 실행한다.
name: donggree

include:
  - monitoring/docker-compose.yml

services:
  # PostgreSQL. 데이터는 named volume 에 저장 → 컨테이너 재생성해도 유지. AWS 에선 EBS 로 교체.
  db:
    image: postgres:16
    container_name: donggree-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-donggree}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    # 쿼리 실행시간 측정용 pg_stat_statements 활성화 (postgres-exporter 가 읽음)
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    ports:
      - "5432:5432"          # 로컬 DB 툴 접속용. 운영에서는 제거 권장(내부 접근만).
    volumes:
      - donggree-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # 최초 init 시 확장 생성
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-donggree}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [monitoring]

  # 스프링 부트 백엔드. 루트 Dockerfile 로 이미지를 빌드한다.
  backend:
    build: .
    container_name: donggree-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy   # DB 가 준비된 뒤에 시작
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # DB (compose 내부에서는 서비스명 db 로 접근)
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-donggree}
      DB_USER: ${POSTGRES_USER:-root}
      DB_PW: ${POSTGRES_PASSWORD:-1234}
      # 최초 기동 시 스키마 자동 생성/갱신. 운영 안정화 후 validate 로 바꾸고 마이그레이션 도구 사용 권장.
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      # 앱 시크릿 — 반드시 .env 에서 주입 (없으면 앱이 뜨지 않음)
      JWT_SECRET: ${JWT_SECRET}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      KAKAO_REST_API_SECRET: ${KAKAO_REST_API_SECRET}
      FRONTEND_REDIRECT_URL: ${FRONTEND_REDIRECT_URL:-http://localhost:5173/login/callback}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
    ports:
      - "8080:8080"          # 로컬 API 직접 호출용. 운영에선 리버스 프록시(Caddy) 뒤에 둠.
    networks: [monitoring]

volumes:
  donggree-db-data:

networks:
  monitoring:
    name: donggree-monitoring
