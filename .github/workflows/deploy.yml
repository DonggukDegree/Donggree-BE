name: Deploy to homeserver

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.gradle"
      - "settings.gradle"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dongree-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, homeserver, dongree-home]
    timeout-minutes: 30

    env:
      REPO_DIR: /Users/parkparkjihyeon/homeserver/services/dongree/repo
      SERVICE_DIR: /Users/parkparkjihyeon/homeserver/services/dongree

    steps:
      - name: Sync repo on host
        run: |
          cd "$REPO_DIR"
          git fetch --all --prune
          git reset --hard origin/main

      - name: Build Spring Boot image
        run: |
          cd "$SERVICE_DIR"
          docker compose build

      - name: Restart backend
        run: |
          cd "$SERVICE_DIR"
          docker compose up -d

      - name: Smoke test (actuator/health via Caddy)
        run: |
          for i in 1 2 3 4 5; do
            if docker exec caddy wget -q -O- \
                --header "Host: dongree.jihyeon.site" \
                http://localhost/actuator/health > /dev/null 2>&1; then
              echo "Backend OK"
              exit 0
            fi
            echo "Retry $i..."
            sleep 10
          done
          echo "Backend healthcheck failed"
          exit 1
