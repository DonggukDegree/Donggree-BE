name: build&test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: donggree_test
          POSTGRES_PASSWORD: donggree_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U donggree_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DONGGREE_TEST_POSTGRES_URL: jdbc:postgresql://127.0.0.1:5432/postgres
      DONGGREE_TEST_POSTGRES_USER: donggree_test
      DONGGREE_TEST_POSTGRES_PASSWORD: donggree_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Spotless Check
        run: ./gradlew spotlessCheck

      - name: Build & Test
        run: ./gradlew build -x spotlessCheck

      # 올인원 docker-compose(모니터링 include 병합 포함) 문법 검증.
      # 구조만 확인하므로 시크릿은 더미 값으로 치환한다.
      - name: Validate Docker Compose
        env:
          JWT_SECRET: dummy
          KAKAO_REST_API_KEY: dummy
          KAKAO_REST_API_SECRET: dummy
        run: docker compose config -q

      - name: Validate Monitoring Rules
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" prom/prometheus:v3.1.0 check rules /etc/prometheus/alerts.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" prom/prometheus:v3.1.0 test rules /etc/prometheus/alerts.test.yml
          docker run --rm -v "$PWD/monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro" grafana/loki:3.3.2 -config.file=/etc/loki/local-config.yaml -verify-config=true

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'
