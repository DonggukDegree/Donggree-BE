# Grafana 데이터소스 자동 주입. UI 클릭 없이 부팅 시 등록된다.
# 고정 uid 를 부여해 대시보드 JSON 이 이 uid 로 참조한다.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
