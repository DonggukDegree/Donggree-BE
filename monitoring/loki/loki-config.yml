# Loki 단일 바이너리(single-binary) 최소 구성. 로컬/소규모 운영에 적합.
# 로그를 로컬 파일시스템(named volume loki-data)에 저장한다.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: 168h        # 7일치 로그 보관

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
