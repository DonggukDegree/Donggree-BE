# postgres_exporter 커스텀 쿼리 — pg_stat_statements 기반 쿼리 실행시간.
# 동작 조건: DB 에 pg_stat_statements 확장 활성화 (db/init/01-init.sql + shared_preload_libraries).
# 확장이 없으면 이 쿼리만 실패하고 나머지 기본 지표는 정상 동작한다.
pg_stat_statements:
  query: |
    SELECT
      (sum(total_exec_time) / nullif(sum(calls), 0)) AS mean_time_ms,
      sum(calls)                                      AS calls,
      max(max_exec_time)                              AS max_time_ms
    FROM pg_stat_statements
  master: true
  metrics:
    - mean_time_ms:
        usage: "GAUGE"
        description: "전체 문장 평균 실행시간(ms)"
    - calls:
        usage: "COUNTER"
        description: "누적 쿼리 실행 횟수"
    - max_time_ms:
        usage: "GAUGE"
        description: "단일 쿼리 최대 실행시간(ms)"
