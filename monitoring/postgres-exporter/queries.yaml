# postgres_exporter 커스텀 쿼리 — pg_stat_statements 기반.
# 동작 조건: DB 에 pg_stat_statements 확장 활성화 (shared_preload_libraries + CREATE EXTENSION).
# 확장이 없으면 이 쿼리들만 실패하고 나머지 기본 지표는 정상 동작한다.

# (1) 전체 집계 — 평균/최대 실행시간 (요약 패널용)
pg_stat_statements:
  query: |
    SELECT
      (sum(total_exec_time) / nullif(sum(calls), 0)) AS mean_time_ms,
      sum(calls)                                      AS calls,
      max(max_exec_time)                              AS max_time_ms
    FROM pg_stat_statements
  master: true
  metrics:
    - mean_time_ms:
        usage: "GAUGE"
        description: "전체 문장 평균 실행시간(ms)"
    - calls:
        usage: "COUNTER"
        description: "누적 쿼리 실행 횟수"
    - max_time_ms:
        usage: "GAUGE"
        description: "단일 쿼리 최대 실행시간(ms)"

# (2) 쿼리별 Top10 — 가장 느린 쿼리 (튜닝용 테이블 패널)
pg_stat_statements_top:
  query: |
    SELECT
      queryid::text                                            AS queryid,
      left(regexp_replace(query, '\s+', ' ', 'g'), 80)         AS query,
      calls,
      mean_exec_time                                           AS mean_ms,
      max_exec_time                                            AS max_ms
    FROM pg_stat_statements
    WHERE query NOT LIKE '%pg_stat_statements%'
    ORDER BY mean_exec_time DESC
    LIMIT 10
  master: true
  metrics:
    - queryid:
        usage: "LABEL"
        description: "쿼리 식별자"
    - query:
        usage: "LABEL"
        description: "쿼리 텍스트(80자 축약)"
    - calls:
        usage: "GAUGE"
        description: "호출 횟수"
    - mean_ms:
        usage: "GAUGE"
        description: "평균 실행시간(ms)"
    - max_ms:
        usage: "GAUGE"
        description: "최대 실행시간(ms)"
