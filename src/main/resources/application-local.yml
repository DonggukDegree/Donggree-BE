spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PW}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  jwt:
    secret: donggree-local-dev-jwt-secret-key-must-be-at-least-256-bits
  frontend-redirect-url: http://localhost:5173/login/callback
  cors:
    allowed-origins: http://localhost:5173
