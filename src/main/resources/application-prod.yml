# 운영 전용 설정 (SPRING_PROFILES_ACTIVE=prod 로 활성화).
# 리버스 프록시(nginx/로드밸런서) 뒤에서만 의미가 있는 설정은 이 프로필에만 둔다.
server:
  # 프록시가 TLS를 종료하고 내부로는 http로 전달하므로, X-Forwarded-Proto 등
  # 포워딩 헤더를 신뢰해 원래 scheme(https)을 복원한다. 이게 없으면 OAuth
  # redirect-uri의 {baseUrl}이 http로 생성돼 카카오 등록 URI(https)와 불일치한다.
  # 신뢰할 수 있는 프록시가 앞단에 있는 운영에서만 켠다(로컬은 미적용 — 헤더 위조 위험 차단).
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PW}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false

# 운영에서는 API 명세(Swagger UI/OpenAPI JSON)를 노출하지 않는다.
# 전체 엔드포인트 구조가 인증 없이 공개되는 것을 막기 위함. (로컬/개발 프로필에서는 그대로 활성화)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
