spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_REST_API_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/oauth/callback/{registrationId}"
            client-authentication-method: client_secret_post
            scope:
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: 1800000      # 30분
    refresh-expiration: 604800000   # 7일
  frontend-redirect-url: ${FRONTEND_REDIRECT_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: donggree
    distribution:
      # HTTP 요청 처리시간을 히스토그램(버킷)으로 노출한다.
      # 이게 있어야 Prometheus 의 histogram_quantile() 로 p95/p99 를 계산할 수 있고,
      # 여러 인스턴스에 걸쳐 합산 가능한 정확한 백분위가 나온다.
      percentiles-histogram:
        http.server.requests: true
      # 자주 보는 지연 구간에 버킷을 촘촘히 배치해 백분위 정확도를 높인다.
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 300ms, 500ms, 1s, 2s
      # 버킷 개수 폭증을 막기 위해 관측 범위를 제한한다.
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 5s

springdoc:
  swagger-ui:
    # 태그를 알파벳순 정렬해 동일 접두어("Admin · ")끼리 한곳에 모이게 한다. (기본은 스캔 순서라 흩어짐)
    tags-sorter: alpha
    operations-sorter: method
